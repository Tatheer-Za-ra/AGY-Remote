[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antigravity-mobile-companion"
version = "0.1.0"
description = "A secure mobile companion and remote control for Google Antigravity IDE"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antigravity Community" }
]
dependencies = [
    "mcp>=1.0.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0"
]

[project.scripts]
antigravity-mobile-companion = "antigravity_companion.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/antigravity_companion"]

